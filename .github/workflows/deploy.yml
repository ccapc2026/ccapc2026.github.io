name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static site
        # A project page lives at /<repo>, so Next needs a matching basePath.
        # A user page (<user>.github.io) or custom domain needs none.
        run: |
          # Owner names preserve case (CCAPC) while the repo name is lowercase
          # (ccapc.github.io), so both sides are folded before comparing.
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "Org/user site -> serving from domain root, no basePath"
            BASE_PATH="" npm run build
          else
            echo "Project site -> basePath=/$REPO"
            BASE_PATH="/$REPO" npm run build
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
